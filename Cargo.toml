[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/napi",
]
default-members = [
    "crates/core",
    "crates/napi",
]
exclude = ["projects"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MPL-2.0"
authors = ["WAE Team <team@wae.dev>"]
repository = "https://github.com/nyar-os/OpenDesktop"

[workspace.dependencies]
open-desktop-core = { path = "crates/core", version = "0.0.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Facade from doki-land/wae-framework (pinned rev for CI).
wae = { git = "https://github.com/doki-land/wae-framework.git", rev = "42838d8270c9e5b46093c61482be58b7987ed246" }

[profile.release]
lto = true
panic = "abort"
