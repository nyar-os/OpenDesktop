[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/napi",
]
default-members = [
    "crates/core",
    "crates/napi",
]
exclude = ["projects"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
authors = ["WAE Team <team@wae.dev>"]
repository = "https://github.com/nyar-os/OpenDesktop"

[workspace.dependencies]
open-desktop-core = { path = "crates/core", version = "0.0.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Facade from doki-land/wae-framework (pinned rev for CI).
wae = { git = "https://github.com/doki-land/wae-framework.git", rev = "b5d555cc9f492858c602b62c3bd46a6be69012d4" }

[profile.release]
lto = true
panic = "abort"
