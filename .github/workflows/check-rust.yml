name: check-rust

on:
  push:
    branches: [dev]
  pull_request:

jobs:
  check-rust:
    strategy:
      fail-fast: false
      matrix:
        # The native addon ships for win32-x64 first. Keep Ubuntu for the
        # portable core and crate-level tests. Skip macOS to avoid long
        # arm64 runner queues that cancel the whole check.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v5
      # Reads rust-toolchain.toml so CI cannot drift from the pinned channel.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
